<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Pizza&Front</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="img/VectorPizza.svg" alt="Logo" />
        <div class="nombre-local">
          <span class="logo-texto-uno">Pizza</span>
          <span class="logo-texto-dos">&</span>
          <span class="logo-texto-tres">Front</span>
        </div>
      </div>
      <nav>
        <ul class="contenedor-menu">
          <li><a class="menu" href="#">Home</a></li>
          <li><a class="menu" href="#">Ranking</a></li>
          <li><a class="menu" href="#">Promoción</a></li>
          <li><a class="menu" href="#">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contenedor-info">
        <div class="fondo">
          <span class="logo-texto-tres">Envio gratis </span>
          <span class="logo-texto-dos"> comprando </span>
          <span class="logo-texto-tres"> 2 pizzas</span>
        </div>
        <div class="caja2">
          <p class="titulo">Podio de pizzas</p>
          <div class="lista">
            <div>
              <p>Pizzas top 5</p>
              <ol>
                <li>Muzzarella</li>
                <li>Hawaiana</li>
                <li>Muzzarella J&Morron</li>
                <li>Fugazzeta</li>
                <li>Calabresa</li>
              </ol>
            </div>
            <img class="img-caja2" src="img/PizzaFalling.jpg" alt="" />
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div>
        <ul class="contenedor-menu-footer">
          <li><a class="menu" href="#">Home</a></li>
          <li><a class="menu" href="#">Ranking</a></li>
          <li><a class="menu" href="#">Promoción</a></li>
          <li><a class="menu" href="#">Contacto</a></li>
        </ul>
      </div>
      <div class="logo">
        <img src="img/VectorPizza.svg" alt="Logo" />
        <div class="nombre-local">
          <span class="logo-texto-uno">Pizza</span>
          <span class="logo-texto-dos">&</span>
          <span class="logo-texto-tres">Front</span>
        </div>
      </div>
    </footer>
  </body>
</html>
